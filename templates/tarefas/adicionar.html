{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de tarefas</title>
</head>
<body>
<div class="container">
    <h1>Adicionar Tarefa</h1>

    <form method="post">
        {% csrf_token %}
        <p>
            <label>Nome:</label><br>
            {{ form.nome }}
        </p>
        <p>
            <label>Descrição:</label><br>
            {{ form.descricao }}
        </p>
        <p>
            <label>Concluída:</label><br>
            {{ form.completo }}
        </p>
        <br>
        <button class="btn btn-adicionar" type="submit">Salvar</button>
        <a href="{% url 'tarefas:lista_tarefas' %}" class="btn btn-editar">Voltar</a>
    </form>
</div>
</body>
</html>
